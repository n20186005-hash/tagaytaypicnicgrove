# wrangler.toml — Cloudflare Workers 部署配置
# 适用：Astro 纯静态站点（构建输出 ./dist），使用 Workers Static Assets 托管
# 说明：本项目是静态生成（无 SSR），所以不需要 @astrojs/cloudflare 适配器。
#       入口 worker/index.js 只负责 HTTP→HTTPS 301、缓存头与安全头，
#       页面内容仍然全部由 dist/ 静态资源提供。
# 部署：pnpm build && pnpm deploy（手工部署，未接入 CI）

name = "tagaytaypicnicgrove"

# 可选：指定 Cloudflare 账户 ID（留空则使用当前 wrangler login 的账户）
# account_id = "your-cloudflare-account-id"

# 兼容性日期：固定为部署时的稳定版本（更新 wrangler 时可酌情前移）
compatibility_date = "2026-09-20"

# Worker 入口（HTTP→HTTPS 301 + 缓存/安全响应头）
main = "./worker/index.js"

# 静态资源托管：把 Astro 构建产物作为站点资源
# directory 必须与 astro.config 的构建输出目录（dist）一致
# 声明了 main 入口，就必须同时给出 binding，Worker 内用 env.ASSETS 回源静态文件
[assets]
directory = "./dist"
binding = "ASSETS"
# 若日后需要 404 自定义页，取消下一行注释（需先生成 dist/404.html）
# not_found = "./dist/404.html"

# 自定义域名在 Cloudflare 控制台的 Workers → 自定义域 中绑定（tagaytaypicnicgrove.com）。
# 站点地址（canonical、sitemap、JSON-LD 的绝对 URL）在构建期由 src/config.ts 解析：
#   1. 优先读取环境变量 CURRENT_SITE_DOMAIN；
#   2. 未设置时回退到 tagaytaypicnicgrove.com。
# 若需要在 CI 中覆盖，可在构建前设置：CURRENT_SITE_DOMAIN=tagaytaypicnicgrove.com pnpm build
# 注意：[vars] 只在运行时 Worker 脚本里可读，静态托管用不到，故不在此配置。
